name: Offline demo direct-file check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/demo-direct-file.yml'

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python demo/verify_direct_file.py
