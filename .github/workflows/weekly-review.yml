name: Weekly project review

on:
  schedule:
    # Saturday at 09:00 in Tehran (05:30 UTC).
    - cron: '30 5 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-project-review
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      demo: ${{ steps.demo.outcome }}
      research: ${{ steps.research.outcome }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify demo rules
        id: demo
        run: node --test demo/review.test.js
      - name: Verify research tools
        id: research
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s research

  publish:
    name: Record the weekly result
    if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Commit the report once per week
        env:
          DEMO_RESULT: ${{ needs.verify.outputs.demo }}
          RESEARCH_RESULT: ${{ needs.verify.outputs.research }}
          REPORT_BRANCH: maintenance/weekly
          TZ: Asia/Tehran
        run: |
          week=$(date +%G-W%V)
          recorded_at=$(date --iso-8601=minutes)
          report="reports/${week}.md"
          if git ls-remote --exit-code --heads origin "refs/heads/${REPORT_BRANCH}" >/dev/null; then
            git fetch --no-tags origin "refs/heads/${REPORT_BRANCH}"
            git switch -c "$REPORT_BRANCH" FETCH_HEAD
          else
            status=$?
            if [[ $status -ne 2 ]]; then
              exit "$status"
            fi
            git switch --orphan "$REPORT_BRANCH"
          fi

          if [[ -f "$report" ]]; then
            printf 'A report already exists for %s.\n' "$week"
            exit 0
          fi

          mkdir -p reports
          cat > "$report" <<EOF
          # گزارش هفتگی پروژه / Weekly project review — $week

          - زمان بررسی به وقت تهران / Checked at Tehran local time: $recorded_at
          - آزمون قواعد دمو / Demo rule tests: ${DEMO_RESULT:-not run}
          - آزمون ابزارهای پژوهش / Research tool tests: ${RESEARCH_RESULT:-not run}
          - [نسخهٔ بررسی‌شده / Source revision]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)
          - [گزارش اجرای آزمون‌ها / Workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$report"
          git commit -m "Record weekly project verification for $week"
          git push origin "HEAD:refs/heads/${REPORT_BRANCH}"
